<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting the Grid</title>
<meta name="description" content="Route a new electricity transmission connection across the map, and see what it costs in money, environment and community support.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="img/marker-generation.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/guidance.css">
<link rel="stylesheet" href="css/summary.css">
</head>
<body>

<!-- The whole game is one screen that never scrolls. See the App shell
     section in css/style.css for how the map is given whatever space is
     left over, both ways, without anything being measured in JavaScript. -->
<div class="app">

  <header class="topbar">
    <h1 id="gameTitle">Connecting the Grid</h1>
    <div class="topbar-actions">
      <button type="button" class="btn" id="newMapButton"></button>
      <button type="button" class="btn" id="dailyButton"></button>
      <button type="button" class="btn" id="weeklyButton"></button>
      <button type="button" class="btn" id="undoButton"></button>
      <button type="button" class="btn" id="resetButton"></button>
      <button type="button" class="btn btn-quiet" id="instructionsTab"></button>
      <button type="button" class="btn btn-quiet" id="tourButton"></button>
    </div>
  </header>

  <div class="app-main">

    <aside class="rail">

      <section class="panel" aria-labelledby="dialsHeading">
        <h2 id="dialsHeading">Points</h2>
        <div class="meters" id="meters"></div>

        <!-- The best finish still open: how well a route from where the
             line has got to could still score. A number and the verdict it
             would earn, never a direction. See js/foresight.js. -->
        <div class="forecast" id="forecast" hidden>
          <p class="forecast-head">
            <span class="forecast-label" id="forecastLabel"></span>
            <span class="forecast-value" id="forecastValue"></span>
          </p>
          <p class="forecast-line" id="forecastLine"></p>
          <p class="forecast-actions">
            <button type="button" class="btn btn-small" id="explainButton"></button>
            <span class="forecast-key" id="explainKey"></span>
          </p>
        </div>

        <!-- Shown in place of the meters while Blind mode holds the score
             back. See css/summary.css. -->
        <p class="hint blind-note" id="blindNote"></p>

        <!-- The route so far, in facts: length, ground crossed, technology,
             and the dial that would decide the verdict now. Never a forecast.
             One line until opened, because the rail has to fit a 1280x720
             screen. See js/summary.js. -->
        <details class="route-summary">
          <summary id="summaryHeading"></summary>
          <div id="summary"></div>
        </details>
      </section>

      <section class="panel" aria-labelledby="techHeading">
        <h2 id="techHeading">Technology</h2>
        <div class="tech-picker" id="tech"></div>
        <p class="hint" id="techHint"></p>
      </section>

      <!-- Two switches on one row. Their explanations are spoken with the
           switch and shown on hover, rather than printed under it: two
           printed hints cost more height than the rail has. -->
      <section class="panel switches">
        <label class="switch" id="committedSwitch">
          <input type="checkbox" id="committedToggle" aria-describedby="committedHint">
          <span id="committedLabel"></span>
        </label>
        <label class="switch" id="blindSwitch">
          <input type="checkbox" id="blindToggle" aria-describedby="blindHint">
          <span id="blindLabel"></span>
        </label>
        <p class="visually-hidden" id="committedHint"></p>
        <p class="visually-hidden" id="blindHint"></p>
      </section>

      <p class="seed-line">
        <span id="seedLabel"></span>
        <code id="seedValue"></code>
        <span class="difficulty" id="difficulty" hidden></span>
        <!-- The kind of landscape, from its seed. See js/archetypes.js. -->
        <span class="archetype" id="archetype" hidden></span>
      </p>

      <!-- Type a landscape's name to play that exact landscape again. The
           generator has always honoured a seed given to it; this is the
           first way to give it one. -->
      <form class="seed-form" id="seedForm">
        <input type="text" id="seedInput" autocomplete="off" spellcheck="false"
               maxlength="12" size="8">
        <button type="submit" class="btn btn-small" id="seedGo"></button>
      </form>
      <!-- The legend goes last on purpose. It is the only panel that
           grows, and anything under it is pushed out of view when it does. -->
      <details class="panel legend-drawer">
        <summary id="legendHeading">What the land means</summary>
        <ul class="legend" id="legend"></ul>
        <p class="legend-note">
          Numbers read cost / environment / community, per cell.
        </p>
      </details>

    </aside>

    <!-- The map. Three layers, stacked in one square: the drawn landscape
         underneath, the grid of real buttons over it, and the arrows
         showing where the line can go next on top. -->
    <div class="stage">
      <div class="board-wrap" id="boardWrap">
        <div class="art-layer" id="art"></div>
        <div class="board" id="board"></div>
        <div class="chevrons" id="chevrons" aria-hidden="true"></div>
        <div class="tip" id="tip" role="presentation" hidden></div>
      </div>
    </div>

  </div>

  <!-- Announced politely so a screen reader hears each move without being
       interrupted mid-sentence. -->
  <p class="status" id="status" role="status" aria-live="polite" data-tone="info"></p>

</div>

<dialog class="sheet" id="instructionsDialog" aria-labelledby="instructionsHeading">
  <h2 id="instructionsHeading">How to play</h2>
  <p class="sheet-lead" id="instructionsLead"></p>
  <div id="instructionsBody"></div>
  <form method="dialog">
    <button type="submit" class="btn" id="instructionsClose"></button>
  </form>
</dialog>

<dialog class="sheet" id="verdictDialog" aria-labelledby="verdictHeading">
  <p class="sheet-eyebrow" id="verdictHeading">Verdict</p>
  <h2 id="verdictTitle"></h2>
  <p id="verdictBody"></p>

  <!-- Filled in from the balance search: how the route compares with the
       best one the checker found on this landscape. -->
  <p class="sheet-par" id="verdictPar" hidden></p>

  <!-- The result as plain text. Shown only when the clipboard is not
       available, which on file:// is most of the time. -->
  <label class="sheet-share" id="verdictShareBox" hidden>
    <span id="verdictShareHint"></span>
    <textarea id="verdictShareText" readonly rows="6"></textarea>
  </label>

  <div class="sheet-actions">
    <button type="button" class="btn btn-primary" id="verdictAgain"></button>
    <button type="button" class="btn" id="verdictBest"></button>
    <button type="button" class="btn" id="verdictShare"></button>
    <form method="dialog">
      <button type="submit" class="btn" id="verdictClose"></button>
    </form>
  </div>
</dialog>

<!-- Plain scripts in dependency order. Deliberately not ES modules: module
     scripts are blocked by CORS on file:// URLs, and this game has to run
     when index.html is opened straight off the disk.

       config   nothing
       rng      nothing
       score    config
       mapgen   config, rng, score
       balance  config, score
       foresight   config, score, balance
       advice   config, score
       mapsymbols  nothing
       mapart   config, rng, mapsymbols
       routeart config, mapart
       render   config, score, mapart, routeart
       guidance config, score, advice, render
       tour     config
       archetypes   config, rng, mapgen, balance
       summary      config, score
       summarypanel config, summary, archetypes
       game     all of the above
-->
<script src="js/config.js"></script>
<script src="js/rng.js"></script>
<script src="js/score.js"></script>
<script src="js/mapgen.js"></script>
<script src="js/balance.js"></script>
<script src="js/foresight.js"></script>
<script src="js/advice.js"></script>
<script src="js/archetypes.js"></script>
<script src="js/mapsymbols.js"></script>
<script src="js/mapart.js"></script>
<script src="js/routeart.js"></script>
<script src="js/render.js"></script>
<script src="js/guidance.js"></script>
<script src="js/tour.js"></script>
<script src="js/summary.js"></script>
<script src="js/summarypanel.js"></script>
<script src="js/game.js"></script>

</body>
</html>
