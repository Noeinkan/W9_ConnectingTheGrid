<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connecting the Grid</title>
<meta name="description" content="Route a new electricity transmission connection across the map, and see what it costs in money, environment and community support.">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="img/marker-generation.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="page">

  <header class="masthead">
    <h1 id="gameTitle">Connecting the Grid</h1>
    <p id="gameStrapline">Route a new transmission connection from the generation site to the demand centre.</p>
  </header>

  <div class="game-shell">

    <!-- Sidebar: tabs, palette, meters -->
    <aside class="sidebar">

      <nav class="tabs" aria-label="Game">
        <button type="button" class="tab tab-home" id="homeTab">Home</button>
        <button type="button" class="tab" id="instructionsTab">Instructions</button>
      </nav>

      <section class="panel" aria-labelledby="piecesHeading">
        <h2 id="piecesHeading">Pieces</h2>
        <div class="palette" id="pieces"></div>
        <p class="hint" id="piecesHint"></p>
      </section>

      <section class="panel" aria-labelledby="dialsHeading">
        <h2 id="dialsHeading">Points</h2>
        <div class="meters" id="meters"></div>
      </section>

      <section class="panel" aria-labelledby="techHeading">
        <h2 id="techHeading">Choose your technology</h2>
        <div class="tech-picker" id="tech"></div>
        <p class="hint" id="techHint"></p>
      </section>

    </aside>

    <!-- The board and everything that reports on it -->
    <main class="board-area">

      <section class="panel board-wrap" aria-labelledby="boardHeading">
        <h2 id="boardHeading" class="visually-hidden">Route map</h2>
        <div class="board" id="board"></div>
      </section>

      <!-- Announced politely so a screen reader hears each move without
           being interrupted mid-sentence. -->
      <p class="status" id="status" role="status" aria-live="polite" data-tone="info"></p>

      <div class="board-foot">
        <section class="panel" aria-labelledby="controlsHeading">
          <h2 id="controlsHeading">Controls</h2>
          <div class="controls">
            <button type="button" class="btn" id="undoButton">Undo last piece</button>
            <button type="button" class="btn" id="resetButton">Start again</button>
          </div>
        </section>

        <section class="panel" aria-labelledby="legendHeading">
          <h2 id="legendHeading">What the land means</h2>
          <ul class="legend" id="legend"></ul>
          <p class="legend-note">
            Numbers read cost / environment / community, per cell.
          </p>
        </section>
      </div>

    </main>
  </div>
</div>

<dialog class="sheet" id="instructionsDialog" aria-labelledby="instructionsHeading">
  <h2 id="instructionsHeading">How to play</h2>
  <div id="instructionsBody"></div>
  <form method="dialog">
    <button type="submit" class="btn">Close</button>
  </form>
</dialog>

<dialog class="sheet" id="verdictDialog" aria-labelledby="verdictHeading">
  <p class="sheet-eyebrow" id="verdictHeading">Verdict</p>
  <h2 id="verdictTitle"></h2>
  <p id="verdictBody"></p>
  <form method="dialog">
    <button type="submit" class="btn">Close</button>
  </form>
</dialog>

<!-- Plain scripts in dependency order. Deliberately not ES modules: module
     scripts are blocked by CORS on file:// URLs, and this game has to run
     when index.html is opened straight off the disk. -->
<script src="js/config.js"></script>
<script src="js/score.js"></script>
<script src="js/render.js"></script>
<script src="js/game.js"></script>

</body>
</html>
